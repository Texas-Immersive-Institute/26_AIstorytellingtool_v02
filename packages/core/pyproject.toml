[project]
name = "aistory-core"
version = "0.1.0"
description = "Shared code for the Story and Takes apps: app data paths, settings files, host/LAN access checks"
requires-python = ">=3.11"
dependencies = [
    "fastembed>=0.5.0",
    "httpx>=0.28.0",
    "pydantic>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aistory_core"]

[project]
name = "story-app"
version = "0.1.0"
description = "Story: author and run audience-influenced branching narratives"
requires-python = ">=3.11"
dependencies = [
    "aistory-core",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "python-multipart>=0.0.12",
    "segno>=1.6.0",
]

[project.scripts]
storytool = "story_app.__main__:main"

[tool.uv.sources]
aistory-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/story_app"]

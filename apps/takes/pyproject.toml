[project]
name = "takes-app"
version = "0.1.0"
description = "Takes: generate video takes with the H3 ComfyUI and play them as a sequence"
requires-python = ">=3.11"
dependencies = [
    "aistory-core",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.28.0",
    "pydantic>=2.9.0",
    "python-multipart>=0.0.12",
    "pywebview>=5.0",
]

[project.scripts]
takestool = "takes_app.__main__:main"

[tool.uv.sources]
aistory-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/takes_app"]
